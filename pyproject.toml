[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perspective_rotation"
version = "0.1.0"
authors = [
  { name="Andy Hicks", email="your.email@example.com" },
]
description = "A lightweight package to correct for perspective rotation in Milky Way satellite galaxies."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.20",
    "astropy>=5.0",
]