[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "persprot"
version = "0.1.0"
description = "A lightweight Python package to assess and correct perspective rotation in Milky Way satellite galaxies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
  { name = "Andy Hicks", email = "andrew.hicks@yale.edu" },
  { name = "Marla Geha" }
]
keywords = ["astronomy", "kinematics", "galaxies", "radial-velocity", "milky-way"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20",
    "astropy>=5.0",
]

[project.urls]
"Homepage" = "https://github.com/YourUsername/persprot"
"Bug Tracker" = "https://github.com/YourUsername/persprot/issues"
"Paper" = "https://arxiv.org/"  # Add arXiv link when available
